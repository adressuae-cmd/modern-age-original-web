name: modern-age-original
services:
  android:
    image: redroid/redroid:14.0.0_64only-latest
    platform: linux/arm64
    privileged: true
    command:
      - androidboot.redroid_width=1280
      - androidboot.redroid_height=720
      - androidboot.redroid_dpi=240
    volumes:
      - android_data:/data
    networks:
      - android_private
    restart: unless-stopped

  web:
    image: ghcr.io/ioucode/ws-scrcpy:latest
    platform: linux/arm64
    environment:
      ADB_CONNECT: android:5555
      ADB_CONNECT_INTERVAL: "15"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - android
    networks:
      - android_private
    restart: unless-stopped

  install_game:
    build: ./installer
    platform: linux/arm64
    volumes:
      - ./game/original.xapk:/game/original.xapk:ro
    depends_on:
      - android
    networks:
      - android_private
    profiles:
      - setup
    restart: "no"

networks:
  android_private:
    driver: bridge
volumes:
  android_data:
